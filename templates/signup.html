{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Signup Page</title>
  <link rel="stylesheet" href="{% static 'css/signup.css' %}">
  <style>
    /* minimal necessary CSS for the eye button */
    .password-block {
      position: relative; /* required so toggle sits correctly */
    }
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #666;
      padding: 4px;
      line-height: 1;
    }
    .password-toggle:focus { outline: 2px solid rgba(0,163,255,0.25); border-radius: 4px; }
  </style>
</head>
<body>

<form class="container" action="/signup/" method="post">
    {% csrf_token %}
    <div class="form-section">
        <h2>Create an account</h2>
        <p class="login-text">Already have an account? <a href="/login/">Login</a></p>

        <div class="form-group">
            <input type="text" name="first_name" placeholder="First Name" required>
            <input type="text" name="last_name" placeholder="Last Name" required>
        </div>

        <div class="input-block">
            <input type="email" name="email" placeholder="Email" required>
        </div>

        <div class="input-block password-block">
            <input id="password-input" type="password" name="password" placeholder="Enter your password" required>
            <!-- toggle inserted by JS if not present -->
        </div>

        <button type="submit" class="btn">Create account</button>
    </div>

    <div class="image-section"></div>
</form>

<script>
document.addEventListener('DOMContentLoaded', function () {
  // find the password input
  const pwdBlock = document.querySelector('.password-block');
  if (!pwdBlock) return;

  const pwdInput = pwdBlock.querySelector('input[type="password"], input[type="text"][name="password"], input[name="password"]');
  if (!pwdInput) return;

  // avoid inserting duplicate toggle if page re-renders
  if (pwdBlock.querySelector('.password-toggle')) return;

  // create accessible button
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'password-toggle';
  btn.setAttribute('aria-pressed', 'false');
  btn.setAttribute('aria-label', 'Show password');
  btn.innerHTML = '👁️';

  // toggle handler
  btn.addEventListener('click', function () {
    const isHidden = pwdInput.type === 'password';
    pwdInput.type = isHidden ? 'text' : 'password';
    btn.innerHTML = isHidden ? '🙈' : '👁️';
    btn.setAttribute('aria-pressed', isHidden ? 'true' : 'false');
    btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
  });

  // append toggle to block
  pwdBlock.appendChild(btn);
});
</script>
</body>
</html>
